<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOD Perio Past Exams | Perio Atlas</title>
  <link rel="stylesheet" href="exam.css">
  <script src="data.js" defer></script>
  <script src="exam.js" defer></script>
</head>
<body>
  <header class="top">
    <a href="../">Perio Atlas</a>
    <span>Past exams</span><a href="practice/">Case practice</a>
  </header>
  <main>
    <section id="home">
      <h1>DOD Perio Past Exams</h1>
      <p class="intro">Practice the surviving 2022–2025 exam recalls. Answers and source notes appear after submission.</p>
      <div id="years"></div>
    </section>
    <section id="attempt" hidden>
      <div class="attempt-header">
        <div><button id="back" class="quiet" type="button">← All years</button><h1 id="exam-title"></h1></div>
        <div class="metrics"><span id="timer" aria-label="Elapsed time"></span><span id="progress"></span></div>
      </div>
      <p id="result" role="status" hidden></p>
      <div class="exam-layout">
        <article id="question"></article>
        <aside aria-label="Exam navigation">
          <h2>Questions</h2>
          <nav id="palette" aria-label="Question numbers"></nav>
          <button id="submit" class="primary" type="button">Submit exam</button>
          <a id="source" target="_blank" rel="noopener" hidden>Review original PDF ↗</a>
        </aside>
      </div>
    </section>
  </main>
  <dialog id="confirm">
    <form method="dialog">
      <h2>Submit exam?</h2>
      <p id="confirm-status"></p>
      <div class="controls">
        <button value="cancel">Keep working</button>
        <button class="primary" value="submit">Submit and review</button>
      </div>
    </form>
  </dialog>
</body>
</html>
