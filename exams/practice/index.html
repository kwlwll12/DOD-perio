<!doctype html>
<html lang="en" data-mode="practice">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perio Case Practice | Perio Atlas</title>
  <link rel="stylesheet" href="../exam.css?v=expanded-practice">
  <script src="data.js?v=expanded-practice" defer></script>
  <script src="../exam.js?v=expanded-practice" defer></script>
</head>
<body>
  <header class="top">
    <a href="../../">Perio Atlas</a>
    <span>Case practice</span>
  </header>
  <main>
    <section id="home">
      <h1>Perio Case Practice</h1>
      <p class="intro">Choose a case and submit it on its own. Concept and calculation drills are available as a separate set.</p>
      <div id="years"></div>
    </section>
    <section id="attempt" hidden>
      <div class="attempt-header">
        <div><button id="back" class="quiet" type="button">← All practice sets</button><h1 id="exam-title"></h1></div>
        <div class="metrics"><span id="timer" aria-label="Elapsed time"></span><span id="progress"></span></div>
      </div>
      <p id="result" role="status" hidden></p>
      <div class="exam-layout">
        <article id="question"></article>
        <aside aria-label="Case notes and practice navigation">
          <details id="notes-panel" class="notes-panel" open hidden>
            <summary id="notes-label">Case notes</summary>
            <textarea id="case-notes" aria-labelledby="notes-label" placeholder="Write findings, calculations, or reminders…" spellcheck="false"></textarea>
          </details>
          <h2>Questions</h2>
          <nav id="palette" aria-label="Question numbers"></nav>
          <button id="submit" class="primary" type="button">Submit set</button>
          <a id="source" target="_blank" rel="noopener" hidden>Review case source ↗</a>
          <p id="credit" class="subtle credit" hidden></p>
        </aside>
      </div>
    </section>
  </main>
  <dialog id="confirm">
    <form method="dialog">
      <h2>Submit set?</h2>
      <p id="confirm-status"></p>
      <div class="controls">
        <button value="cancel">Keep working</button>
        <button class="primary" value="submit">Submit and review</button>
      </div>
    </form>
  </dialog>
</body>
</html>
