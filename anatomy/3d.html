<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An interactive L1b periodontal anatomy cutaway.">
<title>Periodontal Cutaway | Perio Atlas</title>
<link rel="stylesheet" href="cutaway.css">
<script type="module" src="cutaway.js"></script>
</head>
<body>
<header class="top">
  <a href="../" class="back">← Perio Atlas</a>
  <div><h1>Periodontal cutaway</h1><p>L1b · Periodontal Health</p></div>
</header>
<main>
  <section class="stage" aria-label="Interactive periodontal cutaway">
    <div class="controls" aria-label="Select an anatomy view">
      <button type="button" data-view="overview" aria-pressed="true">Overview</button>
      <button type="button" data-view="gingiva" aria-pressed="false">Gingival margin</button>
      <button type="button" data-view="attachment" aria-pressed="false">Attachment</button>
    </div>
    <div id="model" tabindex="0" aria-label="3D cutaway. Drag or use arrow keys to rotate. Scroll or use plus and minus to zoom.">
      <svg id="leaders" aria-hidden="true"></svg>
      <div id="pins" aria-label="Anatomical labels"></div>
    </div>
    <div class="controls stage-bottom">
      <span>Drag to rotate · Scroll to zoom</span>
      <button id="minus" type="button" aria-label="Zoom out">−</button>
      <button id="plus" type="button" aria-label="Zoom in">+</button>
      <button id="reset" type="button">Reset view</button>
    </div>
    <div id="unavailable" hidden>3D rendering is unavailable in this browser. The labels and original lecture slides are still available.</div>
  </section>
  <aside class="panel" aria-label="Anatomy details">
    <section id="detail" aria-live="polite"></section>
    <section class="layers">
      <h2>Explore the structures</h2>
      <div id="layer-list"></div>
    </section>
  </aside>
</main>
</body>
</html>
