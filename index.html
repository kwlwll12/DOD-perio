<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="One connected map of periodontology, with original lecture text and slides.">
  <title>Perio Atlas | Periodontology Mind Map</title>
  <link rel="stylesheet" href="map.css?v=canvas">
  <script src="study-content.js" defer></script>
  <script src="map-data.js" defer></script>
  <script src="map.js?v=canvas" defer></script>
</head>
<body>
  <main id="viewport" tabindex="0" aria-label="Periodontology mind map. Drag or use the arrow keys to pan. Scroll or use plus and minus to zoom.">
    <div id="world">
      <svg id="links" width="4350" height="2470" viewBox="0 0 4350 2470" aria-hidden="true"></svg>
    </div>
  </main>
  <header class="toolbar">
    <h1>Perio Atlas</h1>
    <div class="search-wrap">
      <input id="find" type="search" aria-label="Find a concept or lecture" placeholder="Find a concept" autocomplete="off" aria-controls="matches">
      <div id="matches" hidden aria-label="Search results"></div>
    </div>
    <select id="jump" aria-label="Jump to a topic"><option value="">Jump to topic</option></select>
  </header>
  <nav class="zoom" aria-label="Map controls">
    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    <output id="scale" aria-label="Zoom level"></output>
    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" id="fit">Fit all</button>
  </nav>
  <p class="map-hint">Drag to pan · Scroll to zoom · Click a node for details</p>
  <aside id="detail" hidden aria-labelledby="detail-title">
    <button type="button" id="close" aria-label="Close node details">×</button>
    <p id="detail-group"></p>
    <h2 id="detail-title"></h2>
    <div id="detail-body"></div>
  </aside>
  <dialog id="slide">
    <form method="dialog"><span id="slide-title"></span><button type="submit">Close</button></form>
    <img id="slide-full" alt="">
  </dialog>
</body>
</html>
