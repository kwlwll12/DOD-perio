<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore periodontology topics and the original lecture PDFs.">
  <title>Perio Atlas · Periodontology Study Map</title>
  <link rel="stylesheet" href="study.css">
  <script src="study-content.js" defer></script>
  <script src="study.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Perio Atlas Home"><span class="brand-mark" aria-hidden="true">✣</span> Perio<span>Atlas</span></a>
    <div class="top-links"><button type="button" id="top-map">Study Map</button><button type="button" id="top-library">Library <span>20</span></button></div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search concepts or lectures" autocomplete="off" aria-label="Search concepts or lectures"></label>
  </header>
  <div class="shell">
    <nav class="sidebar" aria-label="Study Topics">
      <div class="section-label">Explore</div>
      <button class="nav-item overview" type="button" data-nav="overview"><span class="nav-icon" aria-hidden="true">⊞</span> Overview</button>
      <div class="section-label topic-label">By Topic</div>
      <div id="topic-nav"></div>
      <div class="sidebar-bottom"><button class="nav-item" type="button" data-nav="library"><span class="nav-icon" aria-hidden="true">▤</span> PDF Library</button></div>
    </nav>
    <main id="main">
      <section id="map-view" aria-labelledby="map-heading">
        <div class="page-header">
          <div><p class="eyebrow">PERIODONTICS STUDY ATLAS</p><h1 id="map-heading">Periodontology Study Map</h1><p>Start with any topic and follow the connections that interest you.</p></div>
          <div class="view-toggle" aria-label="View mode"><button type="button" id="graph-mode" aria-pressed="true">Map</button><button type="button" id="list-mode" aria-pressed="false">List</button></div>
        </div>
        <div class="board">
          <section class="graph-card" aria-label="Topic connection map">
            <div class="card-header"><span><i></i> Study Topics</span><button type="button" id="reset">Show all links</button></div>
            <div class="graph-scroll" id="graph-scroll">
              <div class="graph" id="graph">
                <svg id="lines" aria-hidden="true" viewBox="0 0 720 450" preserveAspectRatio="none"></svg>
                <div class="graph-center" aria-hidden="true"><span>✣</span><b>Periodontology</b></div>
              </div>
            </div>
            <div id="topic-list" hidden></div>
            <div class="graph-footer"><span><b></b> Related topics</span><span>Select a topic to highlight its connections.</span></div>
          </section>
          <aside id="details" class="detail-card" aria-label="Selected topic"></aside>
        </div>
        <section class="sources-section" aria-labelledby="sources-title">
          <div class="section-heading"><div><h2 id="sources-title">Related Lectures</h2><p id="sources-description"></p></div><button type="button" class="text-button" id="browse-all">Browse the library →</button></div>
          <div class="sources-grid" id="related-sources"></div>
        </section>
      </section>
      <section id="library-view" hidden aria-labelledby="library-heading">
        <div class="page-header"><div><p class="eyebrow">SOURCE LIBRARY</p><h1 id="library-heading">PDF Library</h1><p id="library-summary" aria-live="polite"></p></div></div>
        <div id="search-topics" class="search-topics"></div>
        <div class="sources-grid" id="library-sources"></div>
      </section>
    </main>
  </div>
  <dialog id="source-dialog">
    <header class="dialog-header"><div><p class="eyebrow" id="dialog-label"></p><h2 id="dialog-title"></h2></div><form method="dialog"><button type="submit" aria-label="Close">✕</button></form></header>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
